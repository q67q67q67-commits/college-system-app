# Narxoz College (NC) — локальное окружение для разработки
# Запуск: docker compose up -d
# Остановка: docker compose down

services:
  api:
    build: .
    container_name: nc-api
    ports:
      - "8080:8080"
    environment:
      NC_ADDR: ":8080"
      NC_DB_URL: postgres://nc:nc_dev@postgres:5432/nc_db?sslmode=disable
      NC_JWT_SECRET: nc-dev-secret-change-in-production
    volumes:
      - ./web:/app/web:ro
      - nc_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nc
      POSTGRES_PASSWORD: nc_dev
      POSTGRES_DB: nc_db
    ports:
      - "5432:5432"
    volumes:
      - nc_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nc -d nc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nc_postgres_data:
  nc_uploads:
