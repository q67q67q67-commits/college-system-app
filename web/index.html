<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Narxoz College — NC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Экран входа -->
    <div id="screen-login" class="screen active">
      <header class="login-header">
        <div class="logo">Narxoz College</div>
        <p class="tagline">Единая платформа для студентов и сотрудников</p>
      </header>
      <main class="login-main">
        <form id="form-login" class="login-form">
          <h1>Вход</h1>
          <div id="login-error" class="error-msg hidden"></div>
          <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="student1@nc.kz" required autocomplete="email">
          </label>
          <label>
            <span>Пароль</span>
            <input type="password" name="password" placeholder="password123" required autocomplete="current-password">
          </label>
          <button type="submit" class="btn btn-primary">Войти</button>
        </form>
        <p class="login-hint">Тестовые аккаунты: director@nc.kz, teacher1@nc.kz, student1@nc.kz — пароль: password123</p>
      </main>
    </div>

    <!-- Основное приложение (после входа) -->
    <div id="screen-app" class="screen">
      <div id="sidebar-overlay" class="sidebar-overlay hidden" aria-hidden="true"></div>
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span class="logo-small">NC</span>
          <span id="user-name" class="user-name"></span>
          <span id="user-role" class="user-role"></span>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-footer">
          <button id="btn-logout" class="btn btn-text">Выйти</button>
        </div>
      </aside>
      <div class="main-wrap">
        <header class="top-bar">
          <button id="btn-menu" class="btn-menu" aria-label="Меню"></button>
          <h2 id="page-title" class="page-title">Главная</h2>
        </header>
        <main id="content" class="content"></main>
      </div>
      <nav id="bottom-nav" class="bottom-nav" aria-label="Навигация">
        <div class="nav-inner" id="bottom-nav-inner"></div>
      </nav>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
